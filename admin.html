
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litewaver | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-[#080d12] text-emerald-100 min-h-screen p-6 font-sans">
    <main class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-emerald-300">
                    Litewaver Admin
                </h1>
                <p class="text-gray-400 mt-2">Comment moderation dashboard</p>
            </div>
            <button id="logoutButton"
                class="hidden bg-red-500/20 text-red-300 px-4 py-2 rounded-lg">
                Log out
            </button>
        </header>

        <section id="loginSection" class="glass rounded-2xl p-8 max-w-md mx-auto">
            <h2 class="text-xl font-semibold mb-6">Administrator Login</h2>

            <form id="loginForm" class="space-y-4">
                <input id="username" type="text" placeholder="Username"
                    autocomplete="username" required
                    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700">

                <input id="password" type="password" placeholder="Password"
                    autocomplete="current-password" required
                    class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700">

                <button type="submit"
                    class="w-full bg-emerald-500 text-gray-950 font-bold p-3 rounded-lg">
                    Log in
                </button>

                <p id="loginMessage" role="alert" class="text-sm text-red-400"></p>
            </form>
        </section>

        <section id="dashboardSection" class="hidden">
            <div class="bg-[#102322]/75 border border-emerald-300/15 backdrop-blur-xl">
                <h2>Welcome, <span id="adminName">Admin</span></h2>
                <p>Manage comments submitted by visitors.</p>
                <p>Total comments: <span id="commentCount">0</span></p>
            </div>

            <div class="bg-[#102322]/75 border border-emerald-300/15 backdrop-blur-xl">
                <h2 class="text-xl font-semibold mb-4">Recent Comments</h2>
                <div id="adminCommentFeed">Loading comments...</div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
